server:
  port: 8094

spring:
  application:
    name: mcp-face-check
  config:
    # training/train.py가 라벨 붙인 셀카로 학습한 판단 기준값(face.symmetry.*). 없으면 FaceCheckProperties 기본값
    import: optional:classpath:symmetry-thresholds.yml
  ai:
    mcp:
      server:
        name: mcp-face-check
        version: 0.1.0
        type: sync
        protocol: streamable
        streamable-http:
          mcp-endpoint: /mcp
        instructions: 얼굴 사진으로 화장 대칭(face_makeup_check)과 이에 낀 것(teeth_check)을 확인하는 서버입니다. 사용자가 "얼굴 확인해 줘"라고 할 때만 씁니다.

face:
  # 사진 base64를 풀었을 때 최대 크기. 앱은 약 6MB까지 보낸다(openapi.yaml TurnRequest.image).
  max-image-bytes: 8MB

management:
  endpoints:
    web:
      exposure:
        include: health
