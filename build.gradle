plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fashionagent'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.ai:spring-ai-bom:2.0.2'
    }
}

dependencies {
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 치아 이물질 분류 모델(우리가 학습한 ONNX)을 서버 안에서 돌림. 리눅스 x64·맥(arm64) 네이티브 포함
    implementation 'com.microsoft.onnxruntime:onnxruntime:1.20.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 실행용 jar 하나만 만든다(Dockerfile이 mcp-face-check-*.jar를 복사).
tasks.named('jar') {
    enabled = false
}

// 테스트 커버리지(JaCoCo). 줄 커버리지가 80% 미만이면 빌드(CI)가 실패한다.
// 보고서: build/reports/jacoco/test/html/index.html
jacoco {
    toolVersion = '0.8.14'
}

tasks.named('test') {
    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn 'test'
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'jacocoTestCoverageVerification'
}
